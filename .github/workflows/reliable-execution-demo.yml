name: Reliable Execution demo tests
on:
  push:
    paths:
      - 'demos/reliable-execution/**'
      - '.github/workflows/reliable-execution-demo.yml'
  pull_request:
    paths:
      - 'demos/reliable-execution/**'
      - '.github/workflows/reliable-execution-demo.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        working-directory: demos/reliable-execution
        run: python -m unittest discover -s tests -v
